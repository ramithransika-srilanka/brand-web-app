<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active campaigns — UGC Platform for Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens and scale — identical to the creator web app (main branch).
     ===================================================================== */
  :root{
    --grey-50:#fff; --grey-50-90:rgba(255,255,255,.9);
    --grey-100:#ececec; --grey-100-20:rgba(236,236,236,.2);
    --grey-200:#d9d9d9; --grey-400:#b3b3b3; --grey-500:#a0a0a0;
    --grey-600:#717171; --grey-700:#414141; --grey-800:#121212;
    --blue-100:#d0dafb; --blue-200:#a1b6f7; --blue-300:#7391f3; --blue-500:#1548eb; --blue-600:#123bbd; --blue-700:#0f2d8f;
    --pink-500:#f433ab;
    --font:'Inter',-apple-system,system-ui,sans-serif;

    /* desktop layout */
    --gutter:24px; --page:1128px; --header:52px; --shell:1128px;
    /* brand-only bar under the top menu (status tabs / blue notice) */
    --subbar:36px;
    /* admin dashboard */
    --page-bg:#f6f6f6; --line:#e6e6e6; --good:#0a7d3e; --bad:#c8102e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  /* Reserve the scrollbar space on every page so short and long pages line up */
  html{scrollbar-gutter:stable;}
  body{background:var(--grey-50);color:var(--grey-800);font-family:var(--font);font-size:14px;line-height:20px;min-height:100dvh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;}
  svg{display:block;}

  /* Screen navigation transition — same signature as the creator app */
  @keyframes screenIn{from{opacity:0;transform:translateY(17px) scale(.988);filter:blur(5px);}to{opacity:1;transform:none;filter:blur(0);}}
  .nav-in{animation:screenIn .46s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.nav-in{animation:none;}}

  /* ================= App shell: top menu ================= */
  .topbar{position:sticky;top:0;z-index:20;height:var(--header);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--shell)) / 2));
    background:var(--grey-50-90);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--grey-200);}
  .brand{grid-column:1;justify-self:start;display:flex;align-items:center;height:32px;color:var(--grey-800);border-radius:8px;transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .brand svg{height:18px;width:auto;aspect-ratio:269/184;}
  .brand:hover{opacity:.8;}
  .brand:active{transform:scale(.96);}
  .tnav{grid-column:2;display:flex;align-items:center;gap:4px;}
  .tnav a{width:52px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-500);transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .tnav a svg{height:17px;width:auto;max-width:20px;}
  .tnav a:hover{background:var(--grey-100);color:var(--grey-700);}
  .tnav a.active{color:var(--grey-800);}
  .tnav a:active{transform:scale(.94);}
  .top-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px;}
  .hicon{width:32px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-800);position:relative;background:#fff;border:1px solid var(--grey-200);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .hicon:hover{background:var(--grey-100);}
  .hicon:active{transform:scale(.94);}
  .hicon.on{background:var(--grey-800);border-color:var(--grey-800);color:var(--grey-50);}
  .hicon svg{width:17px;height:17px;}
  .hicon .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-av{display:block;width:32px;height:32px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .top-av:active{transform:scale(.94);}

  /* ================= Secondary bar: campaign status (same height rhythm as the top menu) ================= */
  .subnav{position:sticky;top:var(--header);z-index:19;height:var(--subbar);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 var(--gutter);background:var(--grey-800);}
  .subnav a{height:26px;padding:0 11px;display:flex;align-items:center;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-500);transition:color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .subnav a:hover{color:var(--grey-200);}
  .subnav a.active{color:#fff;}
  .subnav a:active{transform:scale(.96);}

  /* On a campaign page the status bar becomes a blue notice */
  .viewbar{display:none;position:sticky;top:var(--header);z-index:19;min-height:var(--subbar);grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 max(var(--gutter),calc((100% - var(--shell)) / 2));background:var(--blue-500);font-size:14px;font-weight:500;line-height:20px;color:#fff;text-align:center;}
  .viewbar .msg{grid-column:2;}
  .viewbar-btn{grid-column:3;justify-self:end;display:inline-flex;align-items:center;height:26px;padding:0 11px;border:1px solid #fff;border-radius:100px;font-size:14px;font-weight:500;line-height:20px;color:#fff;white-space:nowrap;transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .viewbar-btn:hover{background:#fff;color:var(--blue-500);}
  .viewbar-btn:active{transform:scale(.96);}
  body.viewing .subnav{display:none;}
  body.viewing .viewbar{display:grid;}

  .content{width:100%;max-width:calc(var(--page) + var(--gutter) * 2);margin:0 auto;padding:18px var(--gutter) 60px;}

  /* ================= Shared components ================= */
  .tags{display:flex;gap:9px;flex-wrap:wrap;}
  .tag{flex-shrink:0;padding:6px 9px;border-radius:75px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);white-space:nowrap;cursor:pointer;transition:background .25s ease,color .25s ease;}
  .tag.active{background:var(--blue-200);}
  .view-btn{background:var(--grey-50);padding:9px 15px;border-radius:75px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);box-shadow:2px 2px 9px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;flex-shrink:0;}

  .progress{height:6px;border-radius:75px;background:#ddd;overflow:hidden;}
  .progress .fill{height:6px;background:var(--blue-500);border-radius:15px;}

  /* Placeholder / empty state */
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:9px;grid-column:1/-1;}
  .ph .tag2{background:var(--blue-100);color:var(--blue-700);font-size:12px;font-weight:600;padding:5px 9px;border-radius:75px;}
  .ph h2{font-size:20px;font-weight:600;color:var(--grey-800);line-height:27px;}
  .ph p{font-size:14px;line-height:20px;color:var(--grey-600);max-width:210px;}

  /* Skeleton while the feed loads */
  .sk{background:var(--grey-100);border-radius:9px;position:relative;overflow:hidden;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .sk-card{display:flex;flex-direction:column;gap:6px;padding:9px;}
  .sk-card .img{height:180px;border-radius:15px;}
  .sk-card .l1{height:20px;width:80%;margin:12px 12px 0;}
  .sk-card .l2{height:12px;width:40%;margin:0 12px;}
  .sk-card .l3{height:6px;margin:3px 12px 12px;border-radius:75px;}

  /* ================= Campaign card ================= */
  .cardwrap{padding:9px;}
  .card-img{position:relative;height:180px;border-radius:15px;overflow:hidden;box-shadow:0 2px 2px rgba(0,0,0,.16);cursor:pointer;background:var(--grey-200);}
  .card-img>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .overlaybar{position:absolute;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 17px;}
  .overlaybar::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:15px;z-index:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .overlaybar>*{position:relative;z-index:1;}
  .details{display:flex;gap:5px;align-items:center;}
  .details svg{width:14px;height:14px;color:#fff;}
  .price-chip{background:var(--grey-100-20);padding:3px 6px;border-radius:15px;font-size:12px;font-weight:500;color:#fff;line-height:12px;}
  .card-content{display:flex;flex-direction:column;gap:6px;padding:12px;}
  .card-content .ctitle{font-size:15px;font-weight:600;line-height:19px;color:#000;cursor:pointer;}
  .card-time{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}
  .card-time .dot{width:2px;height:2px;border-radius:2px;background:var(--grey-600);}
  .progress-group{display:flex;flex-direction:column;gap:3px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:normal;}
  .card-foot .joined{display:flex;gap:3px;align-items:center;font-weight:500;color:var(--grey-800);}
  .card-foot .joined svg{width:14px;height:14px;color:#131927;}
  .card-foot .money{display:flex;gap:3px;align-items:center;white-space:nowrap;color:var(--grey-800);font-weight:500;}
  .card-foot .money b{font-weight:600;color:var(--grey-800);}

  /* ================= Explore: Campaigns ================= */
  .home{padding-top:6px;}
  .home-title{font-size:24px;font-weight:600;line-height:30px;letter-spacing:-.02em;color:#000;}
  /* Search reveals under the heading (toggled from the header search icon) */
  .home-search{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1),margin-top .45s cubic-bezier(.16,1,.3,1);}
  .home-search>div{overflow:hidden;min-height:0;}
  .home-search .search{opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1);}
  .home-search.open{grid-template-rows:1fr;margin-top:12px;}
  .home-search.open .search{opacity:1;transform:none;}
  .search{display:flex;align-items:center;gap:9px;height:36px;margin:1px;padding:0 15px;border:1px solid var(--grey-400);border-radius:75px;background:#fff;transition:border-color .2s ease;}
  .search:focus-within{border-color:var(--blue-300);}
  .search svg{width:22px;height:22px;color:var(--grey-800);flex-shrink:0;}
  .search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:500 14px var(--font);color:var(--grey-800);}
  .search input::placeholder{color:var(--grey-600);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search kbd{font:500 12px/12px var(--font);color:var(--grey-500);padding:3px 6px;border-radius:6px;background:var(--grey-100);}
  .home .tags{margin-top:12px;gap:6px;}
  .tag:active{transform:scale(.96);}

  .feedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px;}
  .feedgrid>.cardwrap,.feedgrid>.sk-card{background:#fff;border:1px solid transparent;border-radius:24px;}
  .feedgrid>.cardwrap{transition:transform .45s cubic-bezier(.16,1,.3,1),border-color .45s cubic-bezier(.16,1,.3,1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 60ms);}
  .feedgrid>.cardwrap:hover{transform:translateY(-2px);border-color:var(--grey-200);}
  .feedgrid .view-btn{transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .feedgrid .view-btn:active{transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.feedgrid>.cardwrap{animation:none;}}

  /* ================= Campaign page (middle column of the creator app's campaign page, main branch) ================= */
  .like-heart{cursor:pointer;display:flex;}
  .like-heart svg{transition:transform .2s ease;}
  .like-heart.liked path{fill:#FF6B4A;}
  .like-heart.liked svg{animation:heartpop .3s ease;}
  @keyframes heartpop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
  .btn-questions{background:var(--blue-100);border:2px solid var(--blue-100);padding:9px 0;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 5px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--blue-700);}
  .cp-list{padding:12px;border-radius:9px;display:flex;flex-direction:column;gap:6px;width:100%;}
  .cp-list .row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;}
  .cp-list .row .k{font-weight:500;color:var(--grey-600);}
  .cp-list .row .v{font-weight:600;color:var(--grey-800);text-align:right;white-space:nowrap;}
  .cp-list .div{height:1px;background:var(--grey-200);margin:3px 0;}
  .cp-list .social{display:flex;gap:6px;align-items:center;}
  .cp-list .social svg{width:16px;height:16px;color:var(--grey-800);}
  .wcard{background:#fff;border-radius:15px;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.12));}
  .band{background:var(--grey-800);display:flex;flex-direction:column;}
  .sheet-b{background:var(--grey-50);border-radius:0 0 21px 21px;}
  .sheet-t{background:var(--grey-50);border-radius:21px 21px 0 0;}

  .cp{display:grid;grid-template-columns:minmax(0,555px);justify-content:center;align-items:start;margin:-18px auto -60px;}
  /* Main column sits between two full-height divider lines */
  .cp-main{border-left:1px solid var(--grey-200);border-right:1px solid var(--grey-200);padding-left:18px;padding-right:18px;}
  .cp-main{display:flex;flex-direction:column;min-width:0;padding-top:18px;padding-bottom:60px;}
  .cp-hero{position:relative;height:225px;border-radius:15px 15px 0 0;background:var(--grey-200);}
  .cp-brandpill{position:absolute;z-index:1;left:20px;bottom:-27px;width:54px;height:54px;border-radius:75px;border:3px solid #fff;overflow:hidden;background:#fff;}
  .cp-brandpill img{width:100%;height:100%;object-fit:cover;display:block;}
  .cp-hero>img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:inherit;}
  .cp-details{display:flex;flex-direction:column;gap:9px;padding:39px 0 18px;}
  .cp-title{font-size:22px;font-weight:600;line-height:26px;letter-spacing:-.02em;color:var(--grey-800);}
  .cp-details>.cp-list{margin-top:9px;padding:6px 0 0;border-radius:0;}
  .cp-joined{display:flex;gap:6px;align-items:center;}
  .cp-avatars{display:flex;}
  .cp-avatars img{width:22px;height:22px;border-radius:15px;border:1.5px solid var(--grey-50);object-fit:cover;margin-left:-6px;background:#ddd;}
  .cp-avatars img:first-child{margin-left:0;}
  .cp-joined .count{font-size:14px;font-weight:500;color:var(--grey-600);}
  .cp-infotags{padding:18px 8px;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .cp-infotags h3{font-size:15px;font-weight:600;line-height:19px;color:var(--grey-800);text-align:center;}
  .cp-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
  .cp-tag{background:var(--grey-200);display:flex;gap:3px;align-items:center;justify-content:center;padding:5px 9px;border-radius:75px;}
  .cp-tag svg{width:20px;height:20px;color:var(--grey-800);}
  .cp-tag span{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);}
  .cp-event{display:flex;justify-content:center;padding:12px 18px;}
  .cp-event-card{display:flex;flex-direction:column;gap:9px;align-items:center;padding:12px 15px;}
  .cp-event-info{display:flex;flex-direction:column;align-items:center;}
  .cp-event-info .line{font-size:18px;font-weight:600;line-height:22px;color:var(--grey-50);text-align:center;}
  .cp-event-info .mut{color:var(--grey-500);}
  .cp-event-row{display:flex;gap:6px;align-items:center;justify-content:center;}
  .cp-event-ic{width:24px;height:24px;flex-shrink:0;color:var(--grey-50);}
  .cp-event-ic svg{width:24px;height:24px;}
  .cp-event-cta{display:flex;flex-direction:column;align-items:center;}
  .cp-event-cta .lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-500);}
  .cp-event-link{display:flex;gap:3px;align-items:center;cursor:pointer;}
  .cp-event-link span{font-size:14px;font-weight:500;line-height:20px;color:var(--blue-300);}
  .cp-event-link .ext{width:16px;height:16px;color:var(--blue-300);}
  .cp-event-link .ext svg{width:16px;height:16px;}
  .cp-reqs{padding:24px 18px 12px;display:flex;flex-direction:column;gap:24px;}
  .cp-reqs h3,.cp-createdby>h3{font-size:15px;font-weight:600;line-height:19px;color:#000;}
  .cp-sec{display:flex;flex-direction:column;gap:9px;}
  .cp-reqs p{font-size:14px;line-height:20px;color:#000;max-width:480px;}
  .cp-reqs h4{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-600);margin-top:9px;}
  .cp-spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .cp-spectile{background:var(--grey-100);border:1px solid var(--grey-200);border-radius:9px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;}
  .cp-spectile .k{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-spectile .v{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .cp-plats{display:flex;flex-wrap:wrap;gap:6px;}
  .cp-plat{display:flex;gap:5px;align-items:center;padding:6px 11px;border-radius:75px;background:#fff;border:1px solid var(--grey-200);font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .cp-plat svg{width:18px;height:18px;}
  .cp-ctas{background:var(--blue-100);border-left:2px solid var(--blue-500);border-radius:0 9px 9px 0;padding:12px 15px;display:flex;flex-direction:column;gap:6px;}
  .cp-ctas p{font-style:italic;color:var(--grey-800);}
  .cp-restrict{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:8px;}
  .cp-restrict li{counter-increment:r;display:flex;gap:9px;align-items:center;font-size:14px;line-height:20px;color:var(--grey-800);}
  .cp-restrict li::before{content:counter(r);width:24px;height:24px;flex-shrink:0;border-radius:75px;background:var(--grey-100);border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--grey-600);}
  .cp-meta{display:flex;gap:6px 15px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);}
  .cp-mi{display:flex;gap:5px;align-items:center;white-space:nowrap;}
  .cp-mi svg{width:16px;height:16px;}
  .cp-metaplat{display:flex;gap:9px;align-items:center;color:var(--grey-600);}
  .cp-metaplat svg{width:16px;height:16px;}
  .cp-createdby{display:flex;flex-direction:column;gap:12px;padding:24px 0 8px;}
  .cp-main>div:not(.band)>.cp-reqs{padding-left:0;padding-right:0;}
  .cp-creatorcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:6px 0 12px;}
  .cp-creatorcard .col{display:flex;flex-direction:column;gap:12px;}
  .cp-identity{display:flex;flex-direction:column;gap:12px;align-items:center;padding:12px 24px 3px;}
  .cp-identity .av{width:48px;height:48px;border-radius:75px;object-fit:cover;background:#fff;}
  .cp-idtext{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .cp-identity .name{font-size:18px;font-weight:600;line-height:18px;color:var(--grey-800);}
  .cp-identity .since{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-cdesc{padding:0 18px;font-size:14px;line-height:20px;color:#000;text-align:center;}
  .cp-stats{display:flex;align-items:center;justify-content:center;padding:12px 18px;}
  .cp-stat{display:flex;flex-direction:column;align-items:center;flex:1;}
  .cp-stat .big{font-size:18px;font-weight:600;color:var(--grey-800);}
  .cp-stat .lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);}
  .cp-stat-div{width:1px;height:29px;background:var(--grey-200);}
  .cp-cmetrics{display:flex;flex-direction:column;gap:6px;padding:18px 18px 6px 6px;}
  .cp-cmetrics .row{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:20px;}
  .cp-cmetrics .row .k{font-weight:400;color:var(--grey-600);}
  .cp-cmetrics .row .v{font-weight:600;color:var(--grey-800);}
  .cp-cmetrics .div{height:1px;background:var(--grey-100);margin:3px 0;}
  .handles{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .handle{display:flex;flex-direction:column;gap:3px;align-items:center;padding:6px;position:relative;flex-shrink:0;}
  .handle .pf{width:48px;height:48px;border-radius:75px;object-fit:cover;background:#fff;}
  .handle .badge{position:absolute;left:39px;top:0;background:#fff;padding:5px;border-radius:15px;display:flex;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));color:#121212;}
  .handle .badge svg{width:12px;height:12px;}
  .handle .fc{font-size:14px;font-weight:500;line-height:20px;color:#121212;}
  .cp-questions{padding:6px 18px 0 6px;}

  /* ================= Admin dashboard: campaign card + sub menu on the left, section on the right ================= */
  body.dash{background:var(--page-bg);--subbar:0px;}
  body.dash .subnav{display:none;}
  .dsh{display:grid;grid-template-columns:264px minmax(0,1fr);gap:24px;align-items:start;padding-top:6px;}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:12px;}
  .dsh-side{position:sticky;top:calc(var(--header) + var(--subbar) + 24px);overflow:hidden;}
  .dsh-cover{position:relative;height:92px;background:var(--grey-200);}
  .dsh-cover>img{width:100%;height:100%;object-fit:cover;object-position:center 35%;}
  .dsh-id{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:18px;}
  .dsh-title{font-size:18px;font-weight:600;line-height:23px;letter-spacing:-.015em;color:var(--grey-800);text-wrap:balance;}
  .dsh-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;font-weight:500;line-height:18px;color:var(--grey-600);}
  .dsh-status{padding:2px 8px;border-radius:100px;font-size:12px;font-weight:600;line-height:16px;background:var(--blue-100);color:var(--blue-700);text-transform:capitalize;}
  .dsh-status.completed{background:var(--grey-100);color:var(--grey-700);}
  .dsh-viewas{display:inline-flex;align-items:center;gap:7px;height:34px;margin-top:6px;padding:0 15px 0 12px;border:1px solid var(--grey-800);border-radius:100px;font-size:14px;font-weight:600;color:var(--grey-800);transition:background .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .dsh-viewas svg{width:17px;height:17px;}
  .dsh-viewas:hover{background:var(--grey-100);}
  .dsh-viewas:active{transform:scale(.96);}
  .dsh-menu{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line);}
  .dsh-menu a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 18px 0 15px;border-left:3px solid transparent;font-size:15px;font-weight:500;line-height:20px;color:var(--grey-700);white-space:nowrap;transition:background .2s ease,color .2s ease;}
  .dsh-menu a:hover{background:var(--page-bg);color:var(--grey-800);}
  .dsh-menu a.on{border-left-color:var(--blue-500);color:var(--blue-600);font-weight:600;}
  .badge-n{min-width:20px;height:20px;padding:0 6px;border-radius:100px;display:inline-flex;align-items:center;justify-content:center;background:var(--pink-500);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}

  .dsh-main{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .dsh-main>.dcard{padding:24px;}
  .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .dh h2{font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.015em;color:var(--grey-800);}
  .dh p{margin-top:2px;font-size:14px;line-height:20px;color:var(--grey-600);}
  .dh .count{font-size:14px;font-weight:500;color:var(--grey-600);white-space:nowrap;}
  .dlink{font-weight:600;color:var(--blue-500);}
  .dlink:hover{text-decoration:underline;}

  /* "Needs your attention" rows (dismissable, like LinkedIn's suggestions) */
  .att-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .att{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;}
  .att b{display:block;font-size:15px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .att span{display:block;margin-top:3px;font-size:14px;line-height:20px;color:var(--grey-700);}
  .x-btn{width:30px;height:30px;margin:-5px -6px 0 0;flex-shrink:0;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-600);transition:background .2s ease,color .2s ease;}
  .x-btn svg{width:18px;height:18px;}
  .x-btn:hover{background:var(--grey-100);color:var(--grey-800);}

  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px;}
  .tile{display:flex;flex-direction:column;gap:2px;padding:16px;border:1px solid var(--line);border-radius:12px;text-align:left;transition:border-color .2s ease;}
  a.tile:hover,button.tile:hover{border-color:var(--grey-400);}
  .tile .n{font-size:24px;font-weight:600;line-height:32px;letter-spacing:-.02em;color:var(--grey-800);font-variant-numeric:tabular-nums;}
  .tile .l{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);}
  a.tile .l{color:var(--blue-500);}
  .tile .d{margin-top:2px;font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);font-variant-numeric:tabular-nums;}
  .up{color:var(--good);} .down{color:var(--bad);}

  .brief{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
  .brief h4{margin-top:9px;font-size:14px;font-weight:600;line-height:20px;color:var(--grey-600);}
  .brief p{font-size:14px;line-height:21px;color:var(--grey-800);max-width:620px;}
  .brief .cp-tags{justify-content:flex-start;}
  .brief .cp-tag{background:var(--grey-100);}
  .dbudget{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:18px;}
  .dbudget .cp-list{padding:0;}

  /* Pending approvals: the original admin view (post fills the centre column, creator on the right), dashboard card on the left */
  /* Three columns with equal outer tracks so the post sits in the middle of the page */
  .dsh.pend{grid-template-columns:minmax(288px,1fr) auto minmax(0,1fr);gap:0;margin:-24px 0 -60px;padding-top:0;}
  .dsh.pend>.dsh-side{align-self:start;width:264px;margin:24px 24px 48px 0;}
  .pfeed{grid-column:2/4;display:grid;grid-template-columns:subgrid;}
  /* Feed of submissions: each one is a full-height row (post | creator), snapping like reels */
  html:has(.pfeed){scroll-snap-type:y mandatory;}
  .pitem{grid-column:1/-1;display:grid;grid-template-columns:subgrid;min-height:calc(100dvh - var(--header) - var(--subbar));scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:calc(var(--header) + var(--subbar));}
  .pitem+.pitem .adm-center{border-top:1px solid var(--grey-200);}
  .adm-center{border-left:1px solid var(--grey-200);border-right:1px solid var(--grey-200);display:flex;justify-content:center;}
  .adm-phone{--w:calc((100dvh - var(--header) - var(--subbar)) * 9 / 16);width:min(var(--w),40vw);align-self:start;overflow:hidden;background:#000;}
  .adm-col{padding:30px 0 48px 24px;}
  .adm-right{min-width:0;}
  .adm-side{position:sticky;top:calc(var(--header) + var(--subbar) + 30px);display:flex;flex-direction:column;gap:18px;max-width:320px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 18px;border-radius:100px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s ease,border-color .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .btn svg{width:17px;height:17px;}
  .btn:active{transform:scale(.96);}
  .btn-pri{background:var(--blue-500);color:#fff;}
  .btn-pri:hover{background:var(--blue-600);}
  .btn-sec{border:1px solid var(--grey-400);color:var(--grey-800);}
  .btn-sec:hover{border-color:var(--grey-800);background:var(--grey-100);}

  /* Approved content grid */
  .apg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 12px;margin-top:18px;}
  .ap{display:flex;flex-direction:column;gap:9px;text-align:left;}
  .ap-media{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--grey-200);}
  .ap-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.16,1,.3,1);}
  .ap:hover .ap-media img{transform:scale(1.03);}
  .ap-media::after{content:"";position:absolute;inset:auto 0 0;height:64px;background:linear-gradient(transparent,rgba(0,0,0,.5));pointer-events:none;}
  .ap-kind{position:absolute;top:8px;left:8px;z-index:1;padding:2px 8px;border-radius:100px;font-size:12px;font-weight:600;line-height:16px;color:#fff;background:rgba(18,18,18,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .ap-kind.new{background:var(--blue-500);}
  .ap-views{position:absolute;left:10px;bottom:9px;z-index:1;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;line-height:16px;color:#fff;font-variant-numeric:tabular-nums;}
  .ap-views svg{width:13px;height:13px;}
  .ap-by{display:flex;align-items:center;gap:8px;min-width:0;}
  .ap-by img{width:24px;height:24px;border-radius:100px;object-fit:cover;flex-shrink:0;}
  .ap-by div{min-width:0;}
  .ap-by b{display:block;font-size:13px;font-weight:600;line-height:17px;color:var(--grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ap-by small{display:block;font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);}

  /* Analytics */
  .chart{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;margin-top:22px;}
  .chart-y{display:flex;flex-direction:column;justify-content:space-between;height:200px;margin-top:-8px;margin-bottom:-8px;font-size:12px;line-height:16px;color:var(--grey-600);text-align:right;font-variant-numeric:tabular-nums;}
  .chart-plot{position:relative;height:200px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--grey-400);
    background:linear-gradient(var(--grey-100) 1px,transparent 1px) 0 0/100% 50%;}
  .chart-col{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default;outline:0;}
  .chart-col i{display:block;width:min(70%,26px);height:var(--h);border-radius:4px 4px 0 0;background:var(--blue-500);transform-origin:bottom;animation:barUp .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i) * 25ms);transition:background .15s ease;}
  .chart-plot:hover .chart-col i{background:var(--blue-200);}
  .chart-plot .chart-col:hover i,.chart-col:focus-visible i{background:var(--blue-500);}
  @keyframes barUp{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .chart-tip{position:absolute;bottom:calc(var(--h) + 8px);left:50%;z-index:2;transform:translate(-50%,4px);padding:6px 10px;border-radius:8px;background:var(--grey-800);color:#fff;font-size:12px;line-height:16px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .chart-tip b{font-weight:600;font-variant-numeric:tabular-nums;}
  .chart-col:hover .chart-tip,.chart-col:focus-visible .chart-tip{opacity:1;transform:translate(-50%,0);}
  .chart-x{grid-column:2;display:flex;justify-content:space-between;margin-top:8px;font-size:12px;line-height:16px;color:var(--grey-600);}
  .an-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
  .meters{display:flex;flex-direction:column;gap:16px;margin-top:18px;}
  .meter .top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;line-height:20px;}
  .meter .top span{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--grey-800);}
  .meter .top svg{width:15px;height:15px;}
  .meter .top b{font-weight:600;color:var(--grey-800);font-variant-numeric:tabular-nums;}
  .meter .top em{font-style:normal;font-weight:500;color:var(--grey-600);margin-left:4px;}
  .meter .adm-bar{margin-top:6px;}
  .tc{width:100%;margin-top:12px;border-collapse:collapse;font-size:14px;line-height:20px;}
  .tc th{padding:8px 0;font-size:12px;font-weight:500;color:var(--grey-600);text-align:right;border-bottom:1px solid var(--line);}
  .tc th:first-child,.tc td:first-child{text-align:left;}
  .tc td{padding:10px 0;text-align:right;color:var(--grey-800);font-weight:500;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);}
  .tc tr:last-child td{border-bottom:0;}
  .tc .who{display:flex;align-items:center;gap:9px;font-weight:600;}
  .tc .who img{width:28px;height:28px;border-radius:100px;object-fit:cover;}

  /* Inbox */
  .dsh-main>.ib{display:grid;grid-template-columns:280px minmax(0,1fr);height:min(640px,calc(100dvh - var(--header) - var(--subbar) - 48px));padding:0;overflow:hidden;}
  .ib-list{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;}
  .ib-list h2{padding:18px 18px 12px;font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.015em;}
  .ib-scroll{overflow-y:auto;}
  .ib-item{display:flex;gap:10px;width:100%;padding:12px 18px 12px 15px;border-left:3px solid transparent;text-align:left;transition:background .2s ease;}
  .ib-item:hover{background:var(--page-bg);}
  .ib-item.on{border-left-color:var(--blue-500);background:var(--blue-100);background:color-mix(in srgb,var(--blue-100) 45%,#fff);}
  .ib-item img{width:40px;height:40px;border-radius:100px;object-fit:cover;flex-shrink:0;}
  .ib-item .t{flex:1;min-width:0;}
  .ib-item .r1{display:flex;justify-content:space-between;gap:6px;font-size:14px;line-height:20px;}
  .ib-item .r1 b{font-weight:600;color:var(--grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ib-item .r1 small{font-size:12px;font-weight:500;color:var(--grey-600);white-space:nowrap;}
  .ib-item .pv{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--grey-600);}
  .ib-item .pv span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ib-item.unread .pv span{color:var(--grey-800);font-weight:600;}
  .ib-item .udot{width:8px;height:8px;border-radius:100px;background:var(--blue-500);flex-shrink:0;}
  .ib-thread{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .ib-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .ib-head .adm-creator img{width:40px;height:40px;}
  .ib-msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:18px;overflow-y:auto;}
  .ib-day{align-self:center;margin:6px 0;font-size:12px;font-weight:500;color:var(--grey-500);}
  .bub{max-width:min(75%,440px);padding:9px 13px;border-radius:12px;font-size:14px;line-height:20px;}
  .bub.them{align-self:flex-start;background:var(--grey-100);color:var(--grey-800);border-bottom-left-radius:4px;}
  .bub.me{align-self:flex-end;background:var(--blue-500);color:#fff;border-bottom-right-radius:4px;}
  .bub.new{animation:bubIn .35s cubic-bezier(.16,1,.3,1) both;}
  @keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .ib-form{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line);}
  .ib-form input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid var(--grey-400);border-radius:100px;outline:0;font:500 14px var(--font);color:var(--grey-800);background:#fff;transition:border-color .2s ease;}
  .ib-form input:focus{border-color:var(--blue-300);}
  .ib-form .btn{height:40px;}

  .dempty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:36px 12px 18px;text-align:center;}
  .dempty b{font-size:16px;font-weight:600;line-height:22px;color:var(--grey-800);}
  .dempty span{max-width:320px;font-size:14px;line-height:20px;color:var(--grey-600);}

  .dsh>*{animation:admIn .6s cubic-bezier(.16,1,.3,1) both;}
  .dsh>:nth-child(2){animation-delay:60ms;} .dsh>:nth-child(3){animation-delay:120ms;}
  @keyframes admIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}

  /* Shared pieces from the original admin view (post, creator, caption, budget) */
  .adm-sec{display:flex;flex-direction:column;gap:8px;}
  .adm-sec+.adm-sec{padding-top:18px;border-top:1px solid var(--line);}
  .adm-eyebrow{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-600);}

  /* Left: campaign */
  .adm-title{font-size:20px;font-weight:600;line-height:25px;letter-spacing:-.02em;color:var(--grey-800);text-wrap:balance;}
  .adm-meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-600);}
  .adm-meta span{display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .adm-meta svg{width:16px;height:16px;}
  .adm-joined{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--grey-800);}
  .adm-joined .cp-avatars img{border-color:#fff;}
  .adm-joined b{font-weight:600;}
  .adm-budget{display:flex;flex-direction:column;gap:8px;}
  .adm-budget .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .adm-budget .spent{font-size:18px;font-weight:600;line-height:22px;letter-spacing:-.015em;color:var(--grey-800);font-variant-numeric:tabular-nums;}
  .adm-budget .of{font-size:14px;font-weight:500;color:var(--grey-600);font-variant-numeric:tabular-nums;}
  .adm-budget .pct{font-size:14px;font-weight:600;color:var(--blue-600);font-variant-numeric:tabular-nums;}
  .adm-bar{height:6px;border-radius:100px;background:var(--grey-100);overflow:hidden;}
  .adm-bar i{display:block;height:100%;width:var(--p);border-radius:inherit;background:var(--blue-500);transform-origin:left;animation:barIn .9s cubic-bezier(.16,1,.3,1) .15s both;}
  @keyframes barIn{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .adm-budget .foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:500;line-height:16px;color:var(--grey-600);font-variant-numeric:tabular-nums;}

  /* Centre: the post, framed like a phone */
  .adm-screen{position:relative;aspect-ratio:9/16;overflow:hidden;background:#111;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
  .adm-screen img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;}
  /* Scroll-edge scrim instead of a hard bar, so the label stays legible over any photo */
  .adm-screen[data-media=car]::before{content:"";position:absolute;inset:0 0 auto;height:72px;z-index:2;pointer-events:none;background:linear-gradient(rgba(0,0,0,.42),transparent);}
  /* Approve / Reject sit on the post, over a bottom scrim; reel controls and carousel dots ride above them */
  .adm-screen::after{content:"";position:absolute;inset:auto 0 0;height:140px;z-index:2;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.55));}
  .adm-act{position:absolute;left:12px;right:12px;bottom:14px;z-index:4;display:flex;gap:8px;}
  .adm-act .btn{flex:1;height:42px;}
  .btn-glass{color:#fff;background:rgba(18,18,18,.4);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);}
  .btn-glass:hover{background:rgba(18,18,18,.6);}
  .adm-count{position:absolute;top:11px;right:11px;z-index:3;padding:2px 8px;border-radius:100px;font-size:12px;font-weight:600;line-height:16px;color:#fff;background:rgba(18,18,18,.45);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);font-variant-numeric:tabular-nums;}

  /* Reel */
  .reel-frame{position:absolute;inset:0;}
  .reel-frame img{transform-origin:50% 40%;animation:reelDrift 15s linear infinite;}
  .adm-screen.paused .reel-frame img{animation-play-state:paused;}
  @keyframes reelDrift{from{transform:scale(1);}to{transform:scale(1.08);}}
  .reel-hit{position:absolute;inset:0;z-index:1;cursor:pointer;}
  .reel-icon{position:absolute;left:50%;top:50%;z-index:3;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:#fff;
    background:rgba(18,18,18,.4);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);opacity:0;transform:scale(.8);pointer-events:none;transition:opacity .2s ease,transform .35s cubic-bezier(.2,.9,.3,1);}
  .reel-icon svg{width:24px;height:24px;}
  .adm-screen.paused .reel-icon{opacity:1;transform:scale(1);}

/* ---------- Reel: tap to pause/play, progress runs on a display-synced clock ---------- */
let media=[];
function stopMedia(){media.forEach(m=>m.stop());media=[];}
function mountReel(el){
  const bar=el.querySelector('.reel-progress i'), icon=el.querySelector('.reel-icon'), hit=el.querySelector('.reel-hit'), mute=el.querySelector('.reel-mute');
  const [mm,ss]=el.dataset.len.split(':').map(Number), dur=(mm*60+ss)*1000;
  let t=0,last=performance.now(),playing=true,raf,flashT;
  const tick=now=>{if(playing&&el.dataset.vis!=='0'){t=(t+now-last)%dur;bar.style.transform=`scaleX(${t/dur})`;}last=now;raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);
  /* Feedback on press, not release */
  hit.addEventListener('pointerdown',()=>{
    playing=!playing;el.classList.toggle('paused',!playing);
    icon.innerHTML=playing?PAUSEIC:PLAYIC;hit.setAttribute('aria-label',playing?'Pause reel':'Play reel');
    clearTimeout(flashT);if(playing){el.classList.add('flash');flashT=setTimeout(()=>el.classList.remove('flash'),450);}
  });
  hit.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hit.dispatchEvent(new PointerEvent('pointerdown'));}});
  mute.addEventListener('pointerdown',()=>{const on=mute.dataset.on!=='1';mute.dataset.on=on?'1':'';mute.innerHTML=on?SOUNDIC:MUTEIC;mute.setAttribute('aria-label',on?'Mute':'Unmute');});
  return {stop(){cancelAnimationFrame(raf);clearTimeout(flashT);}};
}

/* ---------- Carousel: 1:1 drag, momentum projection, critically damped spring, rubber-band edges ---------- */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function rubberband(over,dim,k=0.55){return (over*dim*k)/(dim+k*Math.abs(over));}
function project(v,d=0.998){return (v/1000)*d/(1-d);}
function mountCarousel(el){
  const track=el.querySelector('.car-track'), n=track.children.length, dots=[...el.querySelectorAll('.car-dots i')], count=el.querySelector('.adm-count');
  const prev=el.querySelector('.car-nav.prev'), next=el.querySelector('.car-nav.next');
  let x=0, v=0, idx=0, raf=null, drag=null;
  const W=()=>el.clientWidth;
  const paint=()=>{track.style.transform=`translate3d(${x}px,0,0)`;};
  const setIdx=i=>{idx=i;dots.forEach((d,j)=>d.classList.toggle('on',j===i));count.textContent=`${i+1}/${n}`;prev.disabled=i===0;next.disabled=i===n-1;};
  /* Spring in Apple's terms: damping ratio 1 (no overshoot), response 0.35s. Always starts from the live value + velocity. */
  function springTo(target,vel=0){
    cancelAnimationFrame(raf);
    if(reduceMotion.matches){x=target;v=0;paint();return;}
    const response=.35, k=Math.pow(2*Math.PI/response,2), c=4*Math.PI*1/response;
    v=vel;let last=performance.now();
    const step=now=>{
      const dt=Math.min(.032,(now-last)/1000);last=now;
      v+=(-k*(x-target)-c*v)*dt;x+=v*dt;paint();
      if(Math.abs(x-target)<.4&&Math.abs(v)<4){x=target;v=0;paint();raf=null;return;}
      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
  }
  const go=(i,vel=0)=>{setIdx(Math.max(0,Math.min(n-1,i)));springTo(-idx*W(),vel);};
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.target.closest('.car-nav,.adm-act')) return;
    cancelAnimationFrame(raf);raf=null;                      /* grab it mid-flight: keep the on-screen x */
    drag={id:e.pointerId,startX:e.clientX,baseX:x,hist:[[e.clientX,e.timeStamp]],locked:false};
  });
  el.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const dx=e.clientX-drag.startX;
    if(!drag.locked){if(Math.abs(dx)<6) return;drag.locked=true;el.setPointerCapture(e.pointerId);track.classList.add('dragging');}
    let nx=drag.baseX+dx; const min=-(n-1)*W();
    if(nx>0) nx=rubberband(nx,W()); else if(nx<min) nx=min-rubberband(min-nx,W());
    x=nx;paint();
    drag.hist.push([e.clientX,e.timeStamp]);if(drag.hist.length>6) drag.hist.shift();
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id) return;
    const d=drag;drag=null;track.classList.remove('dragging');
    if(!d.locked){springTo(-idx*W());return;}
    const h=d.hist, a=h[0], b=h[h.length-1], dt=(b[1]-a[1])||1, vel=(b[0]-a[0])/dt*1000; /* px/s */
    const projected=x+project(vel);
    const target=Math.round(-projected/W());
    go(Math.max(idx-1,Math.min(idx+1,target)),vel);       /* one slide per flick, like the real apps */
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-car]');if(b) go(idx+ +b.dataset.car);});
  el.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(idx+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(idx-1);}});
  const onResize=()=>{cancelAnimationFrame(raf);x=-idx*W();paint();};
  addEventListener('resize',onResize);
  setIdx(0);
  return {stop(){cancelAnimationFrame(raf);removeEventListener('resize',onResize);}};
}

  const [root,id,mode,sec]=location.hash.replace(/^#\/?/,'').split('/');
  const campaign=root==='campaign'&&C[id]?id:null;
  return {root,id:campaign,admin:!!campaign&&mode==='admin',sec:SECTIONS.some(x=>x[0]===sec)?sec:'details'};
};
function mountMedia(){
  const els=[...view.querySelectorAll('[data-media]')];
  media=els.map(el=>el.dataset.media==='reel'?mountReel(el):mountCarousel(el));
  /* In the pending feed, a reel only plays while it is on screen */
  const io=new IntersectionObserver(es=>es.forEach(e=>e.target.dataset.vis=e.isIntersecting?'1':'0'),{threshold:.6});
  els.forEach(el=>io.observe(el));media.push({stop:()=>io.disconnect()});
}
/* Re-render the admin section in place (after approve, send, …) without the page transition */
function rerender(){
  const h=parseHash(); if(!h.admin) return;
  stopMedia();view.innerHTML=viewAdmin(h.id,h.sec);bindAssets(view);mountMedia();scrollThread();
}
function scrollThread(){const m=document.getElementById('ib-msgs');if(m) m.scrollTop=m.scrollHeight;
  /* On narrow screens the sub menu is a scrolling row: keep the open section in view */
  const n=document.querySelector('.dsh-menu'),a=n&&n.querySelector('a.on');if(a&&n.scrollWidth>n.clientWidth) n.scrollLeft=a.offsetLeft-(n.clientWidth-a.offsetWidth)/2;}
let lastDash=null;
function route(){
  const {root,id,admin,sec}=parseHash();
  const campaign=!!id;
  if(!campaign) state.tab=TABS[root]?root:'active';
  else if(admin) state.tab=C[id].status;
  stopMedia();
  view.innerHTML=admin?viewAdmin(id,sec):campaign?viewCampaign(id):viewExplore();
  /* Creator view keeps the blue notice; the admin dashboard keeps the status bar and the grey canvas */
  document.body.classList.toggle('viewing',campaign&&!admin);
  document.body.classList.toggle('dash',admin);
  if(campaign&&!admin){
    document.getElementById('viewbar-msg').textContent=`You are viewing this page as ${admin?'an admin':'a creator'}`;
    const sw=document.getElementById('viewbar-switch');
    sw.textContent=admin?'Switch to creator':'Switch to admin';
    sw.href=admin?`#/campaign/${id}`:`#/campaign/${id}/admin`;
  }
  bindAssets(view);
  if(admin){mountMedia();scrollThread();}
  /* Switching sections inside one campaign's dashboard keeps the left column still; only the section content animates in */
  const inDash=admin&&lastDash===id;lastDash=admin?id:null;
  const anim=inDash?[...view.querySelectorAll('.dsh>:not(.dsh-side)')]:[view];
  view.classList.remove('nav-in');anim.forEach(el=>{el.classList.remove('nav-in');void el.offsetWidth;el.classList.add('nav-in');});
  window.scrollTo({top:0,behavior:'instant'});
  renderFeed();
  if(campaign) document.getElementById('search-btn').classList.remove('on');
  else if(state.searchOpen) setSearch(true);
  document.title=(admin?SECTIONS.find(x=>x[0]===sec)[1]+' · '+C[id].title:campaign?C[id].title:TABS[state.tab])+' — UGC Platform for Brands';
  document.querySelectorAll('#tnav a').forEach(n=>n.classList.toggle('active',n.dataset.root==='campaigns'));
  document.querySelectorAll('#subnav a').forEach(n=>{const on=n.dataset.tab===state.tab;n.classList.toggle('active',on);if(on)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});
  closePop();
}
window.addEventListener('hashchange',route);

/* ================= Interactions ================= */
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);}
const pop=document.getElementById('pop-notifs');
function closePop(){pop.classList.remove('open');}
function renderNotifs(){
  const text=n=>n.type==='approved'?`<b>${n.brand} campaign</b><span class="med"> got approved</span>`
    :n.type==='reply'?`<span class="med">Check out the </span><b>reply from ${n.brand}</b>`
    :`<b>+ Rs. ${n.amount}</b><span class="med"> from </span><b>${n.brand}</b><span class="med">, ${n.detail}</span>`;
  const l=document.getElementById('nt-list');
  l.innerHTML=notifications.map(n=>`<div class="nt-item"><img class="nt-logo" data-a="${n.logo}" alt=""><div class="nt-body"><p class="nt-text">${text(n)}</p><span class="nt-time">${n.time}</span></div></div>`).join('');
  bindAssets(l);
}

document.addEventListener('click',e=>{
  const t=e.target;
  const heart=t.closest('.like-heart');
  if(heart){e.preventDefault();heart.classList.toggle('liked');return;}
  if(t.closest('[data-search]')){e.preventDefault();toggleSearch();return;}
  if(t.closest('[data-pop]')){e.preventDefault();pop.classList.toggle('open');return;}
  if(pop.classList.contains('open')&&!t.closest('#pop-notifs')) closePop();
  const cat=t.closest('[data-cat]');
  if(cat){state.cat=cat.dataset.cat;document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c===cat));renderFeed();return;}
  const act=t.closest('[data-act]');
  if(act){e.preventDefault();return doAct(act.dataset.act,act);}
  const th=t.closest('[data-thread]');
  if(th){dash(parseHash().id).thread=+th.dataset.thread;rerender();return document.getElementById('ib-input').focus({preventScroll:true});}
  const go=t.closest('[data-go]');
  if(go) location.hash=go.dataset.go;
});
function doAct(a,el){
  if(a==='soon') return toast('This screen is next to build');
  const h=parseHash(), d=h.admin&&dash(h.id);
  if(d&&a==='dismiss'){d.dismissed.add(el.dataset.k);return rerender();}
  if(d&&(a==='approve'||a==='reject')){
    const [s]=d.pending.splice(+el.closest('[data-i]').dataset.i,1);
    if(a==='approve') d.approved.unshift({...s,img:s.media.items[0],kind:{reel:'Reel',image:'Post',carousel:'Carousel'}[s.media.type],platform:s.followers[0][0],views:0,eng:0,posted:'Just now',isNew:true});
    rerender();
    return toast(a==='approve'?`Approved · ${s.name} has been notified`:`Rejected · ${s.name} has been notified`);
  }
  if(a==='share') return toast('Link copied');
  if(a==='clear'){state.cat='All';state.q='';const qi=document.getElementById('q');if(qi)qi.value='';document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c.dataset.cat==='All'));return renderFeed();}
}

/* Inbox: send a message in the open thread */
document.addEventListener('submit',e=>{
  if(e.target.id!=='ib-form') return;
  e.preventDefault();
  const input=document.getElementById('ib-input'), text=input.value.trim(); if(!text) return;
  const d=dash(parseHash().id), t=d.threads[d.thread];
  t.msgs.forEach(m=>m.length=2);t.msgs.push(['me',text,1]);t.time='now';
  rerender();document.getElementById('ib-input').focus({preventScroll:true});
});

/* Search filters the campaign feed */
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;renderFeed();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(state.searchOpen&&document.getElementById('q'))document.getElementById('q').focus();else toggleSearch();}
  if(e.key==='Escape'){if(state.searchOpen&&document.activeElement.id==='q'){setSearch(false);document.getElementById('search-btn').focus();}closePop();}
});

/* ===== Init ===== */
renderTopNav();
bindAssets(document.body);
renderNotifs();
route();
</script>
</body>
</html>
