<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active campaigns — UGC Platform for Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — identical to the creator web app (from Figma).
     ===================================================================== */
  :root{
    --grey-50:#f6f6f6; --grey-50-90:rgba(246,246,246,.9);
    --grey-100:#ececec; --grey-100-20:rgba(236,236,236,.2);
    --grey-200:#d9d9d9; --grey-400:#b3b3b3; --grey-500:#a0a0a0;
    --grey-600:#717171; --grey-700:#414141; --grey-800:#121212;
    --blue-100:#d0dafb; --blue-200:#a1b6f7; --blue-300:#7391f3; --blue-500:#1548eb; --blue-600:#123bbd; --blue-700:#0f2d8f;
    --pink-500:#f433ab;
    --font:'Inter',-apple-system,system-ui,sans-serif;

    /* desktop layout */
    --gutter:40px; --page:1280px; --header:72px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:var(--grey-50);color:var(--grey-800);font-family:var(--font);font-size:14px;line-height:20px;min-height:100dvh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;}
  svg{display:block;}

  /* Screen navigation transition — same signature as the creator app */
  @keyframes screenIn{from{opacity:0;transform:translateY(22px) scale(.988);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}
  .nav-in{animation:screenIn .46s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.nav-in{animation:none;}}

  /* ================= App shell: top menu ================= */
  .topbar{position:sticky;top:0;z-index:20;height:var(--header);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--page)) / 2));
    background:var(--grey-50-90);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--grey-200);}
  .brand{grid-column:1;justify-self:start;display:flex;align-items:center;height:44px;color:var(--grey-800);border-radius:8px;transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .brand svg{height:28px;width:auto;aspect-ratio:269/184;}
  .brand:hover{opacity:.8;}
  .brand:active{transform:scale(.96);}
  .tnav{grid-column:2;display:flex;align-items:center;gap:8px;}
  .tnav a{width:64px;height:44px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-500);transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .tnav a svg{height:22px;width:auto;max-width:26px;}
  .tnav a:hover{background:var(--grey-100);color:var(--grey-700);}
  .tnav a.active{color:var(--grey-800);}
  .tnav a:active{transform:scale(.94);}
  .top-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:12px;}
  .hicon{width:44px;height:44px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-800);position:relative;background:#fff;border:1px solid var(--grey-200);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .hicon:hover{background:var(--grey-100);}
  .hicon:active{transform:scale(.94);}
  .hicon.on{background:var(--grey-800);border-color:var(--grey-800);color:var(--grey-50);}
  .hicon svg{width:22px;height:22px;}
  .hicon .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-av{display:block;width:44px;height:44px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .top-av:active{transform:scale(.94);}

  /* ================= Secondary menu: campaign status ================= */
  .subnav{position:sticky;top:var(--header);z-index:19;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 var(--gutter);background:var(--grey-800);}
  .subnav a{height:32px;padding:0 14px;display:flex;align-items:center;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-500);transition:color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .subnav a:hover{color:var(--grey-200);}
  .subnav a.active{color:#fff;}
  .subnav a:active{transform:scale(.96);}

  /* On a campaign page the status bar becomes a blue notice */
  .viewbar{display:none;position:sticky;top:var(--header);z-index:19;min-height:48px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--page)) / 2));background:var(--blue-500);font-size:14px;font-weight:500;line-height:20px;color:#fff;text-align:center;}
  .viewbar .msg{grid-column:2;}
  .viewbar-btn{grid-column:3;justify-self:end;height:32px;padding:0 14px;border:1px solid #fff;border-radius:100px;font-size:14px;font-weight:500;line-height:20px;color:#fff;white-space:nowrap;transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .viewbar-btn:hover{background:#fff;color:var(--blue-500);}
  .viewbar-btn:active{transform:scale(.96);}
  body.viewing .subnav{display:none;}
  body.viewing .viewbar{display:grid;}

  .content{width:100%;max-width:calc(var(--page) + var(--gutter) * 2);margin:0 auto;padding:24px var(--gutter) 80px;}

  /* ================= Shared components ================= */
  .tags{display:flex;gap:12px;flex-wrap:wrap;}
  .tag{flex-shrink:0;padding:8px 12px;border-radius:100px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);white-space:nowrap;cursor:pointer;transition:background .25s ease,color .25s ease;}
  .tag.active{background:var(--blue-200);}

  .view-btn{background:var(--grey-50);padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);box-shadow:2px 2px 12px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;flex-shrink:0;}

  .progress{height:6px;border-radius:100px;background:#ddd;overflow:hidden;}
  .progress .fill{height:6px;background:var(--blue-500);border-radius:20px;}

  /* Placeholder / empty state */
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 32px;gap:12px;grid-column:1/-1;}
  .ph .tag2{background:var(--blue-100);color:var(--blue-700);font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;}
  .ph h2{font-size:24px;font-weight:600;color:var(--grey-800);line-height:32px;}
  .ph p{font-size:14px;line-height:20px;color:var(--grey-600);max-width:280px;}

  /* Skeleton while the feed loads */
  .sk{background:var(--grey-100);border-radius:12px;position:relative;overflow:hidden;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .sk-card{display:flex;flex-direction:column;gap:8px;padding:12px;}
  .sk-card .img{height:240px;border-radius:20px;}
  .sk-card .l1{height:20px;width:80%;margin:16px 16px 0;}
  .sk-card .l2{height:12px;width:40%;margin:0 16px;}
  .sk-card .l3{height:6px;margin:4px 16px 16px;border-radius:100px;}

  /* ================= Campaign card ================= */
  .cardwrap{padding:12px;}
  .card-img{position:relative;height:240px;border-radius:20px;overflow:hidden;box-shadow:0 2px 2px rgba(0,0,0,.16);cursor:pointer;background:var(--grey-200);}
  .card-img>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card-logobar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px;}
  .card-logobar .logo{width:36px;height:36px;border-radius:100px;border:1px solid var(--grey-50);object-fit:cover;background:#fff;}
  .heart{width:24px;height:24px;color:#fff;}
  .heart path{fill:rgba(18,18,18,.6);}
  .overlaybar{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;}
  .overlaybar::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:20px;z-index:0;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
  .overlaybar>*{position:relative;z-index:1;}
  .details{display:flex;gap:6px;align-items:center;}
  .details svg{width:14px;height:14px;color:#fff;}
  .price-chip{background:var(--grey-100-20);padding:4px 8px;border-radius:20px;font-size:12px;font-weight:500;color:#fff;line-height:12px;}
  .card-content{display:flex;flex-direction:column;gap:8px;padding:16px;}
  .card-content .ctitle{font-size:16px;font-weight:600;line-height:20px;color:#000;cursor:pointer;}
  .card-time{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}
  .card-time .dot{width:2px;height:2px;border-radius:2px;background:var(--grey-600);}
  .progress-group{display:flex;flex-direction:column;gap:4px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:normal;}
  .card-foot .joined{display:flex;gap:4px;align-items:center;font-weight:500;color:var(--grey-800);}
  .card-foot .joined svg{width:14px;height:14px;color:#131927;}
  .card-foot .money{display:flex;gap:4px;align-items:center;white-space:nowrap;color:var(--grey-800);font-weight:500;}
  .card-foot .money b{font-weight:600;color:var(--grey-800);}

  /* ================= Explore: Campaigns ================= */
  .home{padding-top:16px;}
  .home-title{font-size:40px;font-weight:600;line-height:48px;letter-spacing:-.025em;color:#000;}
  /* Search reveals under the heading (toggled from the header search icon) */
  .home-search{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1),margin-top .45s cubic-bezier(.16,1,.3,1);}
  .home-search>div{overflow:hidden;min-height:0;}
  .home-search .search{opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1);}
  .home-search.open{grid-template-rows:1fr;margin-top:16px;}
  .home-search.open .search{opacity:1;transform:none;}
  .search{display:flex;align-items:center;gap:12px;height:48px;margin:1px;padding:0 20px;border:1px solid var(--grey-400);border-radius:100px;background:#fff;transition:border-color .2s ease;}
  .search:focus-within{border-color:var(--blue-300);}
  .search svg{width:22px;height:22px;color:var(--grey-800);flex-shrink:0;}
  .search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:500 14px var(--font);color:var(--grey-800);}
  .search input::placeholder{color:var(--grey-600);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search kbd{font:500 12px/12px var(--font);color:var(--grey-500);padding:4px 8px;border-radius:8px;background:var(--grey-100);}
  .home .tags{margin-top:24px;gap:8px;}
  .tag:active{transform:scale(.96);}

  .feedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:32px;}
  .feedgrid>.cardwrap,.feedgrid>.sk-card{background:#fff;border:1px solid var(--grey-200);border-radius:32px;}
  .feedgrid>.cardwrap{transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 60ms);}
  .feedgrid>.cardwrap:hover{transform:translateY(-2px);box-shadow:0 20px 40px -24px rgba(18,18,18,.22);}
  .feedgrid .view-btn{transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .feedgrid .view-btn:active{transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.feedgrid>.cardwrap{animation:none;}}

  /* ================= Campaign page (creator page, middle column) ================= */
  .iconbtn{display:flex;align-items:center;padding:4px;border-radius:20px;background:rgba(246,246,246,.5);cursor:pointer;color:#121212;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .iconbtn svg{width:24px;height:24px;}
  .like-heart{cursor:pointer;display:flex;}
  .like-heart svg{transition:transform .2s ease;}
  .like-heart.liked path{fill:#FF6B4A;}
  .like-heart.liked svg{animation:heartpop .3s ease;}
  @keyframes heartpop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
  .btn-questions{background:var(--blue-100);border:2px solid var(--blue-100);padding:12px 0;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 6px rgba(0,0,0,.08);cursor:pointer;width:100%;font-size:14px;font-weight:500;line-height:20px;color:var(--blue-700);}
  .wcard{background:#fff;border-radius:20px;filter:drop-shadow(2px 4px 2px rgba(0,0,0,.12));}
  .band{background:var(--grey-800);display:flex;flex-direction:column;}
  .sheet-b{background:var(--grey-50);border-radius:0 0 28px 28px;}
  .sheet-t{background:var(--grey-50);border-radius:28px 28px 0 0;}

  .cp-main{display:flex;flex-direction:column;min-width:0;max-width:760px;margin:0 auto;}
  .cp-hero{position:relative;height:420px;border-radius:28px 28px 0 0;overflow:hidden;background:var(--grey-200);}
  .cp-hero>img{width:100%;height:100%;object-fit:cover;}
  .cp-headrow{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;}
  .cp-headright{display:flex;gap:12px;align-items:center;}
  .cp-details{position:relative;margin-top:-72px;display:flex;flex-direction:column;gap:12px;align-items:center;padding:16px 16px 24px;background:var(--grey-50);border-radius:40px 40px 0 0;}
  .cp-logo{width:40px;height:40px;border-radius:100px;border:1px solid var(--grey-50);object-fit:cover;background:#fff;}
  .cp-title{font-size:20px;font-weight:600;line-height:24px;color:var(--grey-800);text-align:center;max-width:520px;}
  .cp-time{display:flex;gap:10px;align-items:center;justify-content:center;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-500);}
  .cp-time .dot{width:4px;height:4px;border-radius:4px;background:currentColor;}
  .cp-joined{display:flex;gap:8px;align-items:center;background:var(--grey-200);padding:4px 12px 4px 4px;border-radius:20px;}
  .cp-avatars{display:flex;}
  .cp-avatars img{width:24px;height:24px;border-radius:20px;border:1px solid #f6f6f6;object-fit:cover;margin-left:-8px;background:#ddd;}
  .cp-avatars img:first-child{margin-left:0;}
  .cp-joined .count{font-size:14px;font-weight:600;color:var(--grey-600);}
  .cp-infotags{padding:24px 10px;display:flex;flex-direction:column;gap:16px;align-items:center;}
  .cp-infotags h3{font-size:16px;font-weight:600;line-height:20px;color:var(--grey-800);text-align:center;}
  .cp-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;}
  .cp-tag{background:var(--grey-200);display:flex;gap:4px;align-items:center;justify-content:center;padding:6px 12px;border-radius:100px;}
  .cp-tag svg{width:20px;height:20px;color:var(--grey-800);}
  .cp-tag span{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);}
  .cp-budget{display:flex;align-items:center;justify-content:center;padding:24px 0;}
  .cp-budget .inner{padding:8px 0;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .cp-budget .l{display:flex;gap:8px;align-items:center;justify-content:center;font-size:20px;font-weight:600;line-height:25px;}
  .cp-light{color:var(--grey-50);}
  .cp-mut{color:var(--grey-500);}
  .cp-white{color:#fff;}
  .cp-coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd76a,#e0952b);display:inline-block;}
  .cp-mini{width:54px;height:16px;background:var(--blue-200);border-radius:20px;position:relative;overflow:hidden;display:inline-block;}
  .cp-mini .track{position:absolute;left:9px;top:6px;width:36px;height:4px;background:var(--grey-50);border-radius:20px;}
  .cp-mini .fill{position:absolute;left:9px;top:6px;height:4px;background:var(--blue-500);border-radius:20px;}
  .cp-creators-mini{display:flex;}
  .cp-creators-mini img{width:16px;height:16px;border-radius:20px;object-fit:cover;margin-left:-4px;background:#ddd;}
  .cp-creators-mini img:first-child{margin-left:0;}
  .cp-event{display:flex;justify-content:center;padding:16px 24px;}
  .cp-event-card{display:flex;flex-direction:column;gap:12px;align-items:center;padding:16px 20px;}
  .cp-event-info{display:flex;flex-direction:column;align-items:center;}
  .cp-event-info .line{font-size:20px;font-weight:600;line-height:24px;color:var(--grey-50);text-align:center;}
  .cp-event-info .mut{color:var(--grey-500);}
  .cp-event-row{display:flex;gap:8px;align-items:center;justify-content:center;}
  .cp-event-ic{width:24px;height:24px;flex-shrink:0;color:var(--grey-50);}
  .cp-event-ic svg{width:24px;height:24px;}
  .cp-event-cta{display:flex;flex-direction:column;align-items:center;}
  .cp-event-cta .lbl{font-size:14px;font-weight:500;line-height:20px;color:var(--grey-500);}
  .cp-event-link{display:flex;gap:4px;align-items:center;cursor:pointer;}
  .cp-event-link span{font-size:14px;font-weight:500;line-height:20px;color:var(--blue-300);}
  .cp-event-link .ext{width:16px;height:16px;color:var(--blue-300);}
  .cp-event-link .ext svg{width:16px;height:16px;}
  .cp-reqs{padding:32px 24px 16px;display:flex;flex-direction:column;gap:32px;}
  .cp-reqs h3,.cp-createdby>h3{font-size:16px;font-weight:600;line-height:20px;color:#000;}
  .cp-sec{display:flex;flex-direction:column;gap:12px;}
  .cp-reqs p{font-size:14px;line-height:20px;color:#000;max-width:640px;}
  .cp-reqs h4{font-size:12px;font-weight:600;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-600);margin-top:12px;}
  .cp-spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .cp-spectile{background:var(--grey-100);border:1px solid var(--grey-200);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;}
  .cp-spectile .k{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-spectile .v{font-size:14px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .cp-plats{display:flex;flex-wrap:wrap;gap:8px;}
  .cp-plat{display:flex;gap:6px;align-items:center;padding:8px 14px;border-radius:100px;background:#fff;border:1px solid var(--grey-200);font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);}
  .cp-plat svg{width:18px;height:18px;}
  .cp-ctas{background:var(--blue-100);border-left:3px solid var(--blue-500);border-radius:0 12px 12px 0;padding:16px 20px;display:flex;flex-direction:column;gap:8px;}
  .cp-ctas p{font-style:italic;color:var(--grey-800);}
  .cp-restrict{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px;}
  .cp-restrict li{counter-increment:r;display:flex;gap:12px;align-items:center;font-size:14px;line-height:20px;color:var(--grey-800);}
  .cp-restrict li::before{content:counter(r);width:24px;height:24px;flex-shrink:0;border-radius:100px;background:var(--grey-100);border:1px solid var(--grey-200);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--grey-600);}
  .cp-meta{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .cp-metaplat{display:flex;gap:10px;align-items:center;color:var(--grey-700);}
  .cp-metaplat svg{width:18px;height:18px;}
  .cp-createdby{display:flex;flex-direction:column;gap:16px;padding:32px 24px 10px;}
  .cp-creatorcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:8px 0 16px;}
  .cp-creatorcard .col{display:flex;flex-direction:column;gap:16px;}
  .cp-identity{display:flex;flex-direction:column;gap:16px;align-items:center;padding:16px 32px 4px;}
  .cp-identity .av{width:80px;height:80px;border-radius:100px;object-fit:cover;background:#fff;}
  .cp-idtext{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .cp-identity .name{font-size:20px;font-weight:600;line-height:20px;color:var(--grey-800);}
  .cp-identity .since{font-size:12px;line-height:16px;color:var(--grey-600);}
  .cp-cdesc{padding:0 24px;font-size:14px;line-height:20px;color:#000;text-align:center;}
  .cp-stats{display:flex;align-items:center;justify-content:center;padding:16px 24px;}
  .cp-stat{display:flex;flex-direction:column;align-items:center;flex:1;}

      <div class="ctitle" data-go="#/campaign/${id}">${c.title}</div>${timeHTML(c)}
      <div class="progress-group"><div class="progress"><div class="fill" style="width:${c.progress}%"></div></div>
        <div class="card-foot">${c.joined?`<div class="joined">${ICON.user}<span>${c.joined}</span></div>`:'<span></span>'}<div class="money">${c.money}</div></div></div>
    </div></div>`;
}

/* ---------- Explore ---------- */
function viewExplore(){
  const cats=['All','Price','Mobility','Food','Entertainment','Lifestyle'];
  return `<div class="home">
    <h1 class="home-title">${TABS[state.tab]}</h1>
    <div class="home-search${state.searchOpen?' open':''}" id="home-search"><div>
      <label class="search">${MICON.search}<input id="q" type="search" placeholder="Search" value="${esc(state.q)}" autocomplete="off" aria-label="Search campaigns and brands"${state.searchOpen?'':' tabindex="-1"'}><kbd>Esc</kbd></label>
    </div></div>
    <div class="tags">${cats.map(c=>`<div class="tag${state.cat===c?' active':''}" data-cat="${c}">${c}</div>`).join('')}</div>
    <div class="feedgrid" id="feed"></div>
  </div>`;
}
function renderFeed(){
  const f=document.getElementById('feed'); if(!f) return;
  if(!state.loaded){
    f.innerHTML=Array.from({length:6},()=>`<div class="sk-card"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>`).join('');
    setTimeout(()=>{state.loaded=true;renderFeed();},600);return;
  }
  const q=state.q.trim().toLowerCase();
  let ids=EXPLORE.filter(id=>{const c=C[id];
    if(c.status!==state.tab) return false;
    if(!['All','Price'].includes(state.cat)&&c.cat!==state.cat) return false;
    return !q||(c.title+' '+c.brand).toLowerCase().includes(q);});
  if(state.cat==='Price') ids=[...ids].sort((a,b)=>C[b].budgetN-C[a].budgetN);
  f.innerHTML=ids.length?ids.map((id,i)=>cardHTML(id).replace('class="cardwrap"',`class="cardwrap" style="--i:${i}"`)).join('')
    :`<div class="ph"><div class="tag2">No campaigns</div><h2>Nothing matches “${esc(state.q||state.cat)}”</h2><p>Try another brand name or clear the search to see every ${state.tab} campaign.</p><div class="tag" data-act="clear">Clear filters</div></div>`;
  bindAssets(f);
}

/* ---------- Campaign page (middle column of the creator campaign page) ---------- */
function viewCampaign(id){
  const c=C[id];
  const tags=c.tags.map(t=>`<div class="cp-tag">${CPICON[t[1]]}<span>${t[0]}</span></div>`).join('');
  const metrics=c.metrics.map((m,i)=>(i?'<div class="div"></div>':'')+`<div class="row"><span class="k">${m[0]}</span><span class="v">${m[1]}</span></div>`).join('');
  const handles=c.handles.map(h=>`<div class="handle"><img class="pf" data-a="${c.logo}" data-label="${c.abbr}" alt=""><div class="badge">${PLAT[h[1]]}</div><span class="fc">${h[0]}</span></div>`).join('');
  const num=v=>+String(v).replace(/[^0-9]/g,'');
  const pct=num(c.spent)/(num(c.spent)+num(c.available));
  const mid=c.event
    ? `<div class="cp-event"><div class="cp-event-card">
        <div class="cp-event-info">
          <div class="cp-event-row"><span class="line"><span class="mut">Happening on </span>${c.event.date}</span><span class="cp-event-ic">${CPICON.calendar}</span></div>
          <span class="line">${c.event.time} <span class="mut">at</span></span>
          <div class="cp-event-row"><span class="cp-event-ic">${CPICON.pin}</span><span class="line">${c.event.location}</span></div>
        </div>
        <div class="cp-event-cta"><span class="lbl">Buy tickets from</span><a class="cp-event-link" data-act="soon"><span>${c.event.ticket}</span><span class="ext">${CPICON.extlink}</span></a></div>
      </div></div>`
    : `<div class="cp-budget"><div class="inner">
        <div class="l"><span class="cp-light">${c.available}</span><span class="cp-mini"><span class="track"></span><span class="fill" style="width:${(36*pct).toFixed(1)}px"></span></span><span class="cp-mut">is</span></div>
        <div class="l"><span class="cp-mut">available to spend.</span></div>
        <div class="l"><span class="cp-white">${c.spent}</span><span class="cp-coin"></span><span class="cp-light">was spent <span class="cp-mut">on</span></span></div>
        <div class="l"><span class="cp-mut">creators</span><span class="cp-creators-mini">${AVSET}</span><span class="cp-mut">up to now.</span></div>
      </div></div>`;
  return `<div class="cp-main">
      <div class="cp-hero"><img data-a="${c.img}" data-label="${c.abbr}" alt="">
        <div class="cp-headrow"><a class="iconbtn" href="#/${c.status}" aria-label="Back">${CPICON.chevL}</a><div class="cp-headright"><a class="iconbtn like-heart" aria-label="Save">${CPICON.heart}</a><a class="iconbtn" data-act="share" aria-label="Share">${CPICON.share}</a></div></div>
      </div>
      <div class="cp-details">
        <img class="cp-logo" data-a="${c.logo}" data-label="${c.abbr}" alt="">
        <p class="cp-title">${c.title}</p>
        <div class="cp-time"><span>${c.time}</span>${c.right?`<span class="dot"></span><span>${c.right}</span>`:''}</div>
        <div class="cp-meta"><div class="cp-joined"><div class="cp-avatars">${AVSET}</div><span class="count">${c.joinedShort} creators joined</span></div>
          <div class="cp-metaplat" aria-label="Platforms">${c.platforms.map(p=>`<span title="${PLATNAME[p]}">${PLAT[p]}</span>`).join('')}</div></div>
      </div>
      <div class="band">
        <div class="sheet-b cp-infotags"><h3>Best suited for</h3><div class="cp-tags">${tags}</div></div>
        ${mid}
        <div class="sheet-t cp-reqs" id="reqs">
          <section class="cp-sec"><h3>About this campaign</h3><p>${c.reqDesc}</p></section>
          <section class="cp-sec"><h3>Requirements &amp; resources</h3>
            <div class="cp-spec">${[...SPEC,['Brand visibility',c.visibility]].map(r=>`<div class="cp-spectile"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}</div>
            <h4>Platforms to post on</h4>
            <div class="cp-plats">${c.platforms.map(p=>`<span class="cp-plat">${PLAT[p]}${PLATNAME[p]}</span>`).join('')}</div>
            <h4>Call-to-action ideas</h4>
            <blockquote class="cp-ctas">${c.ctas.map(t=>`<p>“${t}”</p>`).join('')}</blockquote>
            <h4>Restrictions</h4>
            <ol class="cp-restrict">${RESTRICT.map(r=>`<li>${r}</li>`).join('')}</ol>
          </section></div>
      </div>
      <div class="cp-createdby"><h3>Campaign created by</h3>
        <div class="wcard cp-creatorcard">
          <div class="col">
            <div class="cp-identity"><img class="av" data-a="${c.logo}" data-label="${c.abbr}" alt=""><div class="cp-idtext"><p class="name">${c.brand}</p><p class="since">${c.since}</p></div></div>
            <p class="cp-cdesc">${c.brandDesc}</p>
            <div class="cp-stats"><div class="cp-stat"><span class="big">${c.totalPaid}</span><span class="lbl">Total paid</span></div><div class="cp-stat-div"></div><div class="cp-stat"><span class="big">${c.campaigns}</span><span class="lbl">Campaigns</span></div></div>
          </div>
          <div class="col">
            <div class="cp-cmetrics">${metrics}</div>
            <div class="handles">${handles}</div>
            <div class="cp-questions"><div class="btn-questions" data-act="soon">Any questions? Message the brand</div></div>
          </div>
        </div></div>
    </div>`;
}

/* ================= Top menu ================= */
function renderTopNav(){
  const items=[['campaigns','#/active',ICON.explore,'Campaigns']];
  document.getElementById('tnav').innerHTML=items.map(i=>`<a href="${i[1]}" data-root="${i[0]}" aria-label="${i[3]}" title="${i[3]}">${i[2]}</a>`).join('');
  document.getElementById('search-btn').innerHTML=MICON.search;
  document.getElementById('bell-ic').innerHTML=MICON.bell;
}

/* Search lives under the Campaigns heading; the header icon opens and closes it */
function setSearch(open){
  state.searchOpen=open;
  const btn=document.getElementById('search-btn');
  btn.classList.toggle('on',open);btn.setAttribute('aria-expanded',open);
  const wrap=document.getElementById('home-search'); if(!wrap) return;
  wrap.classList.toggle('open',open);
  const input=document.getElementById('q');
  input.tabIndex=open?0:-1;
  if(open) input.focus({preventScroll:true});
  else if(state.q){state.q='';input.value='';renderFeed();}
}
function toggleSearch(){
  if(!document.getElementById('home-search')){state.searchOpen=true;location.hash='#/'+state.tab;return;}
  setSearch(!state.searchOpen);
}

/* ================= Router ================= */
const view=document.getElementById('view');
function route(){
  const [root,id]=location.hash.replace(/^#\/?/,'').split('/');
  const campaign=root==='campaign'&&C[id];
  if(!campaign) state.tab=TABS[root]?root:'active';
  view.innerHTML=campaign?viewCampaign(id):viewExplore();
  document.body.classList.toggle('viewing',!!campaign);
  bindAssets(view);
  view.classList.remove('nav-in');void view.offsetWidth;view.classList.add('nav-in');window.scrollTo({top:0,behavior:'instant'});
  renderFeed();
  if(campaign) document.getElementById('search-btn').classList.remove('on');
  else if(state.searchOpen) setSearch(true);
  document.title=(campaign?C[id].title:TABS[state.tab])+' — UGC Platform for Brands';
  document.querySelectorAll('#tnav a').forEach(n=>n.classList.toggle('active',n.dataset.root==='campaigns'));
  document.querySelectorAll('#subnav a').forEach(n=>{const on=n.dataset.tab===state.tab;n.classList.toggle('active',on);if(on)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});
  closePop();
}
window.addEventListener('hashchange',route);

/* ================= Interactions ================= */
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);}
const pop=document.getElementById('pop-notifs');
function closePop(){pop.classList.remove('open');}
function renderNotifs(){
  const text=n=>n.type==='approved'?`<b>${n.brand} campaign</b><span class="med"> got approved</span>`
    :n.type==='reply'?`<span class="med">Check out the </span><b>reply from ${n.brand}</b>`
    :`<b>+ Rs. ${n.amount}</b><span class="med"> from </span><b>${n.brand}</b><span class="med">, ${n.detail}</span>`;
  const l=document.getElementById('nt-list');
  l.innerHTML=notifications.map(n=>`<div class="nt-item"><img class="nt-logo" data-a="${n.logo}" alt=""><div class="nt-body"><p class="nt-text">${text(n)}</p><span class="nt-time">${n.time}</span></div></div>`).join('');
  bindAssets(l);
}

document.addEventListener('click',e=>{
  const t=e.target;
  const heart=t.closest('.like-heart');
  if(heart){e.preventDefault();heart.classList.toggle('liked');return;}
  if(t.closest('[data-search]')){e.preventDefault();toggleSearch();return;}
  if(t.closest('[data-pop]')){e.preventDefault();pop.classList.toggle('open');return;}
  if(pop.classList.contains('open')&&!t.closest('#pop-notifs')) closePop();
  const cat=t.closest('[data-cat]');
  if(cat){state.cat=cat.dataset.cat;document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c===cat));renderFeed();return;}
  const act=t.closest('[data-act]');
  if(act){e.preventDefault();return doAct(act.dataset.act);}
  const go=t.closest('[data-go]');
  if(go) location.hash=go.dataset.go;
});
function doAct(a){
  if(a==='soon') return toast('This screen is next to build');
  if(a==='share') return toast('Link copied');
  if(a==='clear'){state.cat='All';state.q='';const qi=document.getElementById('q');if(qi)qi.value='';document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c.dataset.cat==='All'));return renderFeed();}
}

/* Search filters the campaign feed */
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;renderFeed();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(state.searchOpen&&document.getElementById('q'))document.getElementById('q').focus();else toggleSearch();}
  if(e.key==='Escape'){if(state.searchOpen&&document.activeElement.id==='q'){setSearch(false);document.getElementById('search-btn').focus();}closePop();}
});

/* ===== Init ===== */
renderTopNav();
bindAssets(document.body);
renderNotifs();
route();
</script>
</body>
</html>
