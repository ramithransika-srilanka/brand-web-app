<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active campaigns — UGC Platform for Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — identical to the creator web app (from Figma).
     ===================================================================== */
  :root{
    --grey-50:#f6f6f6; --grey-50-90:rgba(246,246,246,.9);
    --grey-100:#ececec; --grey-100-20:rgba(236,236,236,.2);
    --grey-200:#d9d9d9; --grey-400:#b3b3b3; --grey-500:#a0a0a0;
    --grey-600:#717171; --grey-700:#414141; --grey-800:#121212;
    --blue-100:#d0dafb; --blue-200:#a1b6f7; --blue-300:#7391f3; --blue-500:#1548eb; --blue-600:#123bbd; --blue-700:#0f2d8f;
    --pink-500:#f433ab;
    --font:'Inter',-apple-system,system-ui,sans-serif;

    /* desktop layout */
    --gutter:40px; --page:1280px; --header:72px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  body{background:var(--grey-50);color:var(--grey-800);font-family:var(--font);font-size:14px;line-height:20px;min-height:100dvh;}
  a{color:inherit;text-decoration:none;cursor:pointer;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  img{display:block;}
  svg{display:block;}

  /* Screen navigation transition — same signature as the creator app */
  @keyframes screenIn{from{opacity:0;transform:translateY(22px) scale(.988);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}
  .nav-in{animation:screenIn .46s cubic-bezier(.16,1,.3,1) both;}
  @media(prefers-reduced-motion:reduce){.nav-in{animation:none;}}

  /* ================= App shell: top menu ================= */
  .topbar{position:sticky;top:0;z-index:20;height:var(--header);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 max(var(--gutter),calc((100% - var(--page)) / 2));
    background:var(--grey-50-90);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--grey-200);}
  .brand{grid-column:1;justify-self:start;display:flex;align-items:center;height:44px;color:var(--grey-800);border-radius:8px;transition:opacity .2s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .brand svg{height:28px;width:auto;aspect-ratio:269/184;}
  .brand:hover{opacity:.8;}
  .brand:active{transform:scale(.96);}
  .tnav{grid-column:2;display:flex;align-items:center;gap:8px;}
  .tnav a{width:64px;height:44px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-500);transition:background .25s ease,color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .tnav a svg{height:22px;width:auto;max-width:26px;}
  .tnav a:hover{background:var(--grey-100);color:var(--grey-700);}
  .tnav a.active{color:var(--grey-800);}
  .tnav a:active{transform:scale(.94);}
  .top-right{grid-column:3;justify-self:end;display:flex;align-items:center;gap:12px;}
  .hicon{width:44px;height:44px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:var(--grey-800);position:relative;background:#fff;border:1px solid var(--grey-200);transition:background .25s ease,border-color .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .hicon:hover{background:var(--grey-100);}
  .hicon:active{transform:scale(.94);}
  .hicon.on{background:var(--grey-800);border-color:var(--grey-800);color:var(--grey-50);}
  .hicon svg{width:22px;height:22px;}
  .hicon .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:100px;background:var(--pink-500);border:1.5px solid #fff;}
  .top-av{display:block;width:44px;height:44px;border-radius:100px;object-fit:cover;border:1px solid var(--grey-200);transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .top-av:active{transform:scale(.94);}

  /* ================= Secondary menu: campaign status ================= */
  .subnav{position:sticky;top:var(--header);z-index:19;height:48px;display:flex;align-items:center;gap:8px;padding:0 max(var(--gutter),calc((100% - var(--page)) / 2));background:var(--grey-800);}
  .subnav a{height:32px;padding:0 14px;border-radius:100px;display:flex;align-items:center;font-size:14px;font-weight:500;line-height:20px;color:#fff;opacity:.6;transition:opacity .25s ease,background .25s ease,transform .2s cubic-bezier(.16,1,.3,1);}
  .subnav a:first-child{margin-left:-14px;}
  .subnav a:hover{opacity:1;}
  .subnav a.active{opacity:1;background:rgba(255,255,255,.14);}
  .subnav a:active{transform:scale(.96);}

  .content{width:100%;max-width:calc(var(--page) + var(--gutter) * 2);margin:0 auto;padding:24px var(--gutter) 80px;}

  /* ================= Shared components ================= */
  .tags{display:flex;gap:12px;flex-wrap:wrap;}
  .tag{flex-shrink:0;padding:8px 12px;border-radius:100px;background:var(--grey-100);font-size:12px;font-weight:500;line-height:12px;color:var(--grey-800);white-space:nowrap;cursor:pointer;transition:background .25s ease,color .25s ease;}
  .tag.active{background:var(--blue-200);}

  .view-btn{background:var(--grey-50);padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;line-height:20px;color:var(--grey-800);box-shadow:2px 2px 12px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;flex-shrink:0;}

  .progress{height:6px;border-radius:100px;background:#ddd;overflow:hidden;}
  .progress .fill{height:6px;background:var(--blue-500);border-radius:20px;}

  /* Placeholder / empty state */
  .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 32px;gap:12px;grid-column:1/-1;}
  .ph .tag2{background:var(--blue-100);color:var(--blue-700);font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;}
  .ph h2{font-size:24px;font-weight:600;color:var(--grey-800);line-height:32px;}
  .ph p{font-size:14px;line-height:20px;color:var(--grey-600);max-width:280px;}

  /* Skeleton while the feed loads */
  .sk{background:var(--grey-100);border-radius:12px;position:relative;overflow:hidden;}
  .sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{transform:translateX(100%);}}
  .sk-card{display:flex;flex-direction:column;gap:8px;padding:12px;}
  .sk-card .img{height:240px;border-radius:20px;}
  .sk-card .l1{height:20px;width:80%;margin:16px 16px 0;}
  .sk-card .l2{height:12px;width:40%;margin:0 16px;}
  .sk-card .l3{height:6px;margin:4px 16px 16px;border-radius:100px;}

  /* ================= Campaign card ================= */
  .cardwrap{padding:12px;}
  .card-img{position:relative;height:240px;border-radius:20px;overflow:hidden;box-shadow:0 2px 2px rgba(0,0,0,.16);cursor:pointer;background:var(--grey-200);}
  .card-img>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card-logobar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px;}
  .card-logobar .logo{width:36px;height:36px;border-radius:100px;border:1px solid var(--grey-50);object-fit:cover;background:#fff;}
  .heart{width:24px;height:24px;color:#fff;}
  .heart path{fill:rgba(18,18,18,.6);}
  .overlaybar{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;}
  .overlaybar::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4);border-radius:20px;z-index:0;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
  .overlaybar>*{position:relative;z-index:1;}
  .details{display:flex;gap:6px;align-items:center;}
  .details svg{width:14px;height:14px;color:#fff;}
  .price-chip{background:var(--grey-100-20);padding:4px 8px;border-radius:20px;font-size:12px;font-weight:500;color:#fff;line-height:12px;}
  .card-content{display:flex;flex-direction:column;gap:8px;padding:16px;}
  .card-content .ctitle{font-size:16px;font-weight:600;line-height:20px;color:#000;cursor:pointer;}
  .card-time{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}
  .card-time .dot{width:2px;height:2px;border-radius:2px;background:var(--grey-600);}
  .progress-group{display:flex;flex-direction:column;gap:4px;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;line-height:normal;}
  .card-foot .joined{display:flex;gap:4px;align-items:center;font-weight:500;color:var(--grey-800);}
  .card-foot .joined svg{width:14px;height:14px;color:#131927;}
  .card-foot .money{display:flex;gap:4px;align-items:center;white-space:nowrap;color:var(--grey-800);font-weight:500;}
  .card-foot .money b{font-weight:600;color:var(--grey-800);}

  /* ================= Explore: Campaigns ================= */
  .home{padding-top:16px;}
  .home-title{font-size:40px;font-weight:600;line-height:48px;letter-spacing:-.025em;color:#000;}
  /* Search reveals under the heading (toggled from the header search icon) */
  .home-search{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.16,1,.3,1),margin-top .45s cubic-bezier(.16,1,.3,1);}
  .home-search>div{overflow:hidden;min-height:0;}
  .home-search .search{opacity:0;transform:translateY(-8px);transition:opacity .3s ease,transform .45s cubic-bezier(.16,1,.3,1);}
  .home-search.open{grid-template-rows:1fr;margin-top:16px;}
  .home-search.open .search{opacity:1;transform:none;}
  .search{display:flex;align-items:center;gap:12px;height:48px;margin:1px;padding:0 20px;border:1px solid var(--grey-400);border-radius:100px;background:#fff;transition:border-color .2s ease;}
  .search:focus-within{border-color:var(--blue-300);}
  .search svg{width:22px;height:22px;color:var(--grey-800);flex-shrink:0;}
  .search input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:500 14px var(--font);color:var(--grey-800);}
  .search input::placeholder{color:var(--grey-600);}
  .search input::-webkit-search-cancel-button{display:none;}
  .search kbd{font:500 12px/12px var(--font);color:var(--grey-500);padding:4px 8px;border-radius:8px;background:var(--grey-100);}
  .home .tags{margin-top:24px;gap:8px;}
  .tag:active{transform:scale(.96);}

  .feedgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:32px;}
  .feedgrid>.cardwrap,.feedgrid>.sk-card{background:#fff;border:1px solid var(--grey-200);border-radius:32px;}
  .feedgrid>.cardwrap{transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s cubic-bezier(.16,1,.3,1);animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 60ms);}
  .feedgrid>.cardwrap:hover{transform:translateY(-2px);box-shadow:0 20px 40px -24px rgba(18,18,18,.22);}
  .feedgrid .view-btn{transition:transform .2s cubic-bezier(.16,1,.3,1);}
  .feedgrid .view-btn:active{transform:scale(.96);}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.feedgrid>.cardwrap{animation:none;}}

  /* ================= Notifications popover ================= */
  .pop{position:fixed;top:calc(var(--header) + 8px);right:var(--gutter);width:400px;max-height:min(560px,calc(100dvh - 88px));z-index:40;display:flex;flex-direction:column;
    background:var(--grey-50);border-radius:28px;box-shadow:0 16px 40px rgba(0,0,0,.18);border:1px solid var(--grey-200);
    opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);}
  .pop.open{opacity:1;transform:none;pointer-events:auto;}
  .nt-title{padding:24px 24px 0;font-size:20px;font-weight:600;line-height:24px;color:var(--grey-800);}
  .nt-list{display:flex;flex-direction:column;gap:16px;padding:20px 16px 24px;overflow-y:auto;}
  .nt-item{display:flex;gap:12px;align-items:flex-start;}
  .nt-logo{width:32px;height:32px;border-radius:20px;object-fit:cover;flex-shrink:0;background:var(--grey-100);}
  .nt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--grey-200);}
  .nt-item:last-child .nt-body{border-bottom:none;padding-bottom:0;}
  .nt-text{font-size:14px;line-height:20px;color:var(--grey-800);font-weight:600;}
  .nt-text .med{font-weight:500;}
  .nt-time{font-size:12px;font-weight:500;line-height:12px;color:var(--grey-600);}

  .toast{position:fixed;left:50%;bottom:32px;z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--grey-800);color:var(--grey-50);
    padding:12px 20px;border-radius:100px;font-size:14px;font-weight:500;box-shadow:2px 2px 12px rgba(0,0,0,.16);transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ================= Responsive ================= */
  @media (max-width:1279px){
    .feedgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:1023px){
    :root{--gutter:24px;}
  }
  @media (max-width:767px){
    :root{--gutter:16px;}
    .topbar{grid-template-columns:auto auto minmax(0,1fr);gap:8px;}
    .brand svg{height:22px;}
    .tnav{gap:0;}
    .tnav a{width:44px;}
    .top-right{gap:8px;}
    .home-title{font-size:32px;line-height:40px;}
    .feedgrid{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:24px;}
    .pop{left:var(--gutter);width:auto;}
  }
</style>
</head>

<script>
function fallback(img){
  const label=(img.dataset.label||"?").slice(0,2).toUpperCase();
  const c=['#1548eb','#f433ab','#717171','#121212'][label.charCodeAt(0)%4];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='${c}'/><text x='50%' y='54%' font-family='Inter,sans-serif' font-size='26' font-weight='600' fill='white' text-anchor='middle' dominant-baseline='middle'>${label}</text></svg>`;
  img.src='data:image/svg+xml;base64,'+btoa(svg);
}
function bindAssets(root){
  root.querySelectorAll('img[data-a]').forEach(img=>{
    if(img.dataset.bound) return; img.dataset.bound=1;
    img.onerror=()=>{img.onerror=null;fallback(img);};
    if(A[img.dataset.a]) img.src=A[img.dataset.a]; else fallback(img);
  });
}

/* ================= Templates ================= */
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const timeHTML=c=>`<div class="card-time"><span>${c.time}</span>${c.right?`<span class="dot"></span><span>${c.right}</span>`:''}</div>`;

function cardHTML(id){
  const c=C[id];
  return `<div class="cardwrap"><div class="card-img" data-act="soon">
      <img class="photo" data-a="${c.img}" data-label="${c.abbr}" alt="">
      <div class="card-logobar"><img class="logo" data-a="${c.logo}" data-label="${c.abbr}" alt="">${ICON.heart}</div>
      <div class="overlaybar"><div class="details">${ICON.tiktok}${ICON.insta}<span class="price-chip">${c.perf.replace(/Rs\. (\d+) \/ 1K views/,'Rs.$1/1K')}</span></div><div class="view-btn">View</div></div>
    </div>
    <div class="card-content">
      <div class="ctitle" data-act="soon">${c.title}</div>${timeHTML(c)}
      <div class="progress-group"><div class="progress"><div class="fill" style="width:${c.progress}%"></div></div>
        <div class="card-foot">${c.joined?`<div class="joined">${ICON.user}<span>${c.joined}</span></div>`:'<span></span>'}<div class="money">${c.money}</div></div></div>
    </div></div>`;
}

/* ---------- Explore ---------- */
function viewExplore(){
  const cats=['All','Price','Mobility','Food','Entertainment','Lifestyle'];
  return `<div class="home">
    <h1 class="home-title">${TABS[state.tab]}</h1>
    <div class="home-search${state.searchOpen?' open':''}" id="home-search"><div>
      <label class="search">${MICON.search}<input id="q" type="search" placeholder="Search" value="${esc(state.q)}" autocomplete="off" aria-label="Search campaigns and brands"${state.searchOpen?'':' tabindex="-1"'}><kbd>Esc</kbd></label>
    </div></div>
    <div class="tags">${cats.map(c=>`<div class="tag${state.cat===c?' active':''}" data-cat="${c}">${c}</div>`).join('')}</div>
    <div class="feedgrid" id="feed"></div>
  </div>`;
}
function renderFeed(){
  const f=document.getElementById('feed'); if(!f) return;
  if(!state.loaded){
    f.innerHTML=Array.from({length:6},()=>`<div class="sk-card"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>`).join('');
    setTimeout(()=>{state.loaded=true;renderFeed();},600);return;
  }
  const q=state.q.trim().toLowerCase();
  let ids=EXPLORE.filter(id=>{const c=C[id];
    if(c.status!==state.tab) return false;
    if(!['All','Price'].includes(state.cat)&&c.cat!==state.cat) return false;
    return !q||(c.title+' '+c.brand).toLowerCase().includes(q);});
  if(state.cat==='Price') ids=[...ids].sort((a,b)=>C[b].budgetN-C[a].budgetN);
  f.innerHTML=ids.length?ids.map((id,i)=>cardHTML(id).replace('class="cardwrap"',`class="cardwrap" style="--i:${i}"`)).join('')
    :`<div class="ph"><div class="tag2">No campaigns</div><h2>Nothing matches “${esc(state.q||state.cat)}”</h2><p>Try another brand name or clear the search to see every ${state.tab} campaign.</p><div class="tag" data-act="clear">Clear filters</div></div>`;
  bindAssets(f);
}

/* ================= Top menu ================= */
function renderTopNav(){
  const items=[['campaigns','#/active',ICON.explore,'Campaigns']];
  document.getElementById('tnav').innerHTML=items.map(i=>`<a href="${i[1]}" data-root="${i[0]}" aria-label="${i[3]}" title="${i[3]}">${i[2]}</a>`).join('');
  document.getElementById('search-btn').innerHTML=MICON.search;
  document.getElementById('bell-ic').innerHTML=MICON.bell;
}

/* Search lives under the Campaigns heading; the header icon opens and closes it */
function setSearch(open){
  state.searchOpen=open;
  const btn=document.getElementById('search-btn');
  btn.classList.toggle('on',open);btn.setAttribute('aria-expanded',open);
  const wrap=document.getElementById('home-search'); if(!wrap) return;
  wrap.classList.toggle('open',open);
  const input=document.getElementById('q');
  input.tabIndex=open?0:-1;
  if(open) input.focus({preventScroll:true});
  else if(state.q){state.q='';input.value='';renderFeed();}
}
function toggleSearch(){
  if(!document.getElementById('home-search')){state.searchOpen=true;location.hash='#/active';return;}
  setSearch(!state.searchOpen);
}

/* ================= Router ================= */
const view=document.getElementById('view');
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  state.tab=TABS[h]?h:'active';
  view.innerHTML=viewExplore();
  bindAssets(view);
  view.classList.remove('nav-in');void view.offsetWidth;view.classList.add('nav-in');window.scrollTo({top:0,behavior:'instant'});
  renderFeed();
  if(state.searchOpen) setSearch(true);
  document.title=TABS[state.tab]+' — UGC Platform for Brands';
  document.querySelectorAll('#tnav a').forEach(n=>n.classList.toggle('active',n.dataset.root==='campaigns'));
  document.querySelectorAll('#subnav a').forEach(n=>{const on=n.dataset.tab===state.tab;n.classList.toggle('active',on);if(on)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});
  closePop();
}
window.addEventListener('hashchange',route);

/* ================= Interactions ================= */
const toastEl=document.getElementById('toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2200);}
const pop=document.getElementById('pop-notifs');
function closePop(){pop.classList.remove('open');}
function renderNotifs(){
  const text=n=>n.type==='approved'?`<b>${n.brand} campaign</b><span class="med"> got approved</span>`
    :n.type==='reply'?`<span class="med">Check out the </span><b>reply from ${n.brand}</b>`
    :`<b>+ Rs. ${n.amount}</b><span class="med"> from </span><b>${n.brand}</b><span class="med">, ${n.detail}</span>`;
  const l=document.getElementById('nt-list');
  l.innerHTML=notifications.map(n=>`<div class="nt-item"><img class="nt-logo" data-a="${n.logo}" alt=""><div class="nt-body"><p class="nt-text">${text(n)}</p><span class="nt-time">${n.time}</span></div></div>`).join('');
  bindAssets(l);
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-search]')){e.preventDefault();toggleSearch();return;}
  if(t.closest('[data-pop]')){e.preventDefault();pop.classList.toggle('open');return;}
  if(pop.classList.contains('open')&&!t.closest('#pop-notifs')) closePop();
  const cat=t.closest('[data-cat]');
  if(cat){state.cat=cat.dataset.cat;document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c===cat));renderFeed();return;}
  const act=t.closest('[data-act]');
  if(act){e.preventDefault();return doAct(act.dataset.act);}
});
function doAct(a){
  if(a==='soon') return toast('This screen is next to build');
  if(a==='clear'){state.cat='All';state.q='';const qi=document.getElementById('q');if(qi)qi.value='';document.querySelectorAll('[data-cat]').forEach(c=>c.classList.toggle('active',c.dataset.cat==='All'));return renderFeed();}
}

/* Search filters the campaign feed */
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;renderFeed();}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(state.searchOpen&&document.getElementById('q'))document.getElementById('q').focus();else toggleSearch();}
  if(e.key==='Escape'){if(state.searchOpen&&document.activeElement.id==='q'){setSearch(false);document.getElementById('search-btn').focus();}closePop();}
});

/* ===== Init ===== */
renderTopNav();
bindAssets(document.body);
renderNotifs();
route();
</script>
</body>
</html>
