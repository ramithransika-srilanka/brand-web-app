<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#1c3150"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a" stop-opacity=".95"/><stop offset="1" stop-color="#ff9d3c" stop-opacity=".85"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf73" stop-opacity=".45"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#sky)"/>
  <circle cx="900" cy="110" r="30" fill="#f4ecd8" opacity=".9"/>
  <g fill="#fff" opacity=".6"><circle cx="120" cy="70" r="1.6"/><circle cx="300" cy="40" r="1.2"/><circle cx="520" cy="80" r="1.4"/><circle cx="760" cy="50" r="1.2"/><circle cx="1040" cy="90" r="1.5"/><circle cx="220" cy="140" r="1"/></g>
