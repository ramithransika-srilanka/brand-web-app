    <rect x="1050" y="280" width="50" height="50" rx="3" fill="url(#glow)"/>
    <rect x="1120" y="280" width="50" height="50" rx="3" fill="#2b4568"/>
    <circle cx="1095" cy="440" r="120" fill="url(#halo)"/>
    <rect x="1060" y="380" width="70" height="120" fill="url(#glow)"/>
