    <rect x="290" y="300" width="80" height="200"/><rect x="380" y="370" width="120" height="130"/><rect x="510" y="250" width="90" height="250"/>
    <rect x="610" y="320" width="120" height="180"/><rect x="830" y="290" width="100" height="210"/><rect x="940" y="360" width="80" height="140"/>
  </g>
