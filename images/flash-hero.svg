  <g fill="#f4ecd8" opacity=".35"><rect x="40" y="548" width="70" height="6" rx="3"/><rect x="190" y="548" width="70" height="6" rx="3"/><rect x="340" y="548" width="70" height="6" rx="3"/><rect x="640" y="548" width="70" height="6" rx="3"/><rect x="790" y="548" width="70" height="6" rx="3"/><rect x="940" y="548" width="70" height="6" rx="3"/></g>
