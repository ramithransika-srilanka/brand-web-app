    <rect x="525" y="270" width="10" height="12"/><rect x="560" y="310" width="10" height="12"/><rect x="525" y="350" width="10" height="12"/><rect x="640" y="340" width="10" height="12"/>
    <rect x="690" y="380" width="10" height="12"/><rect x="850" y="310" width="10" height="12"/><rect x="890" y="350" width="10" height="12"/><rect x="20" y="360" width="10" height="12"/>
    <rect x="200" y="380" width="10" height="12"/><rect x="420" y="400" width="10" height="12"/><rect x="960" y="390" width="10" height="12"/>
